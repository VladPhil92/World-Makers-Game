name: Repository Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  content-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script:
          - validate-content.py
          - validate-trust-economy.py
          - validate-m2-mission-runtime.py
          - validate-m2-1-spatial-measurement.py
          - validate-m2-2-interactive-measurement.py
          - validate-m2-3-mission-progression.py
          - validate-m3-1-biome-runtime.py
          - validate-m3-2-world-interaction.py
          - validate-m3-3-science-mission-runtime.py
          - validate-m3-4-reactive-ecosystem.py
          - validate-m3-5-ecological-building.py
          - validate-m3-6-child-journey-ux.py
          - validate-m3-7-tablet-performance.py
          - validate-m3-8-vertical-slice-certification.py
          - validate-m4-parent-portal.py
          - validate-player-dashboard-d1.py
          - validate-player-dashboard-d2.py
          - validate-m5-2-composable-runtime.py
          - validate-m5-3-science-simulation.py
          - validate-m5-4-language-thought-runtime.py
          - validate-c1-xxii-century-citizenship.py
          - validate-v1-visual-production.py
          - validate-v2-materials-surface.py
          - validate-v3-environment-art.py
          - validate-v4-character-art-rig.py
          - validate-v5-character-animation.py
          - validate-v6-vfx-feedback.py
          - validate-v7-camera-ui-motion.py
          - validate-reference-driven-visual-polish.py
          - validate-first-person-interaction-kit.py
          - validate-first-person-authored-pack.py
          - validate-first-person-native-review-activation.py
          - validate-first-person-activation-runtime-cert.py
          - validate-v8-visual-certification.py
          - validate-p1-authored-assets.py
          - validate-p2-rainforest-assets.py
          - validate-p3-character-assets.py
          - validate-p4-authored-motion-vfx-presentation.py
          - validate-p5-art-polish-certification.py
          - validate-n1-native-integration.py
          - validate-n2-authored-release-candidate.py
          - validate-n3-native-release-certification.py
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ${{ matrix.script }}
        run: python scripts/${{ matrix.script }}

  parent-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/parent-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/parent-portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  player-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/player-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/player-dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
