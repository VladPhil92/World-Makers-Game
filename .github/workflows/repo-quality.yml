name: Repository Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  content-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pedagogical content
        run: python scripts/validate-content.py
      - name: Validate M1.10 Trust Economy
        run: python scripts/validate-trust-economy.py
      - name: Validate M2 Mission Runtime
        run: python scripts/validate-m2-mission-runtime.py
      - name: Validate M2.1 Spatial Measurement
        run: python scripts/validate-m2-1-spatial-measurement.py
      - name: Validate M2.2 Interactive Measurement
        run: python scripts/validate-m2-2-interactive-measurement.py
      - name: Validate M2.3 Mission Progression
        run: python scripts/validate-m2-3-mission-progression.py
      - name: Validate M3.1 Biome Runtime
        run: python scripts/validate-m3-1-biome-runtime.py
      - name: Validate M3.2 World Interaction
        run: python scripts/validate-m3-2-world-interaction.py
      - name: Validate M3.3 Science Mission Runtime
        run: python scripts/validate-m3-3-science-mission-runtime.py
      - name: Validate M3.4 Reactive Ecosystem
        run: python scripts/validate-m3-4-reactive-ecosystem.py
      - name: Validate M3.5 Ecological Building
        run: python scripts/validate-m3-5-ecological-building.py
      - name: Validate M3.6 Child Journey UX
        run: python scripts/validate-m3-6-child-journey-ux.py
      - name: Validate M3.7 Tablet Performance
        run: python scripts/validate-m3-7-tablet-performance.py
      - name: Validate M3.8 Vertical Slice Certification
        run: python scripts/validate-m3-8-vertical-slice-certification.py
      - name: Validate M4.1 Parent Portal MVP
        run: python scripts/validate-m4-parent-portal.py
      - name: Validate M5.2 Composable Mission Runtime
        run: python scripts/validate-m5-2-composable-runtime.py

  parent-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/parent-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/parent-portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
