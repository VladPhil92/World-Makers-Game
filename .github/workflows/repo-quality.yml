name: Repository Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  content-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pedagogical content
        run: python scripts/validate-content.py
      - name: Validate M1.10 Trust Economy
        run: python scripts/validate-trust-economy.py
      - name: Validate M2 Mission Runtime
        run: python scripts/validate-m2-mission-runtime.py
      - name: Validate M2.1 Spatial Measurement
        run: python scripts/validate-m2-1-spatial-measurement.py
      - name: Validate M2.2 Interactive Measurement
        run: python scripts/validate-m2-2-interactive-measurement.py
      - name: Validate M2.3 Mission Progression
        run: python scripts/validate-m2-3-mission-progression.py

  parent-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/parent-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/parent-portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
