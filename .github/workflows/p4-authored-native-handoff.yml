name: P4 Authored Animation VFX Presentation Handoff

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authored-p4-handoff:
    if: ${{ vars.UNREAL_SELF_HOSTED_ENABLED == 'true' }}
    runs-on: [self-hosted, Windows, X64, unreal]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate P4 source contract
        shell: pwsh
        run: python scripts/validate-p4-authored-motion-vfx-presentation.py

      - name: Verify Blender and Unreal production tools
        shell: pwsh
        run: |
          if (-not $env:UNREAL_ENGINE_ROOT) { throw 'UNREAL_ENGINE_ROOT is required.' }
          if (-not $env:BLENDER_EXE) { throw 'Blender path BLENDER_EXE is required.' }
          if (-not (Test-Path $env:BLENDER_EXE)) { throw 'BLENDER_EXE does not exist.' }
          $editor = Join-Path $env:UNREAL_ENGINE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          if (-not (Test-Path $editor)) { throw 'UnrealEditor-Cmd.exe not found.' }

      - name: Generate P3 character source prerequisite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\p4\p3-source | Out-Null
          python scripts/generate-p3-character-source.py --output-dir artifacts/p4/p3-source --verify

      - name: Build P3 rig FBX prerequisite in Blender
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\p4\p3-fbx | Out-Null
          & $env:BLENDER_EXE --background --python scripts/blender/build-p3-character-fbx.py -- --source-dir artifacts/p4/p3-source --output-dir artifacts/p4/p3-fbx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate P4 authored source bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\p4\source | Out-Null
          python scripts/generate-p4-authored-motion-vfx-presentation.py --output artifacts/p4/source/WM_P4_AuthoredMotionVFXPresentation.source.json

      - name: Export 17 animation FBXs in Blender
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\p4\animation-fbx | Out-Null
          & $env:BLENDER_EXE --background --python scripts/blender/export-p4-animation-fbx.py -- --rig-fbx artifacts/p4/p3-fbx/SK_WM_ChildExplorer_LOD0.fbx --source artifacts/p4/source/WM_P4_AuthoredMotionVFXPresentation.source.json --output-dir artifacts/p4/animation-fbx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Import P3 prerequisite Skeletal Mesh in Unreal
        shell: pwsh
        env:
          WM_P3_FBX_DIR: ${{ github.workspace }}\artifacts\p4\p3-fbx
          WM_P3_IMPORT_REPORT: ${{ github.workspace }}\artifacts\p4\p3-import-report.json
        run: |
          $editor = Join-Path $env:UNREAL_ENGINE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          & $editor "$pwd\game\WorldMakers.uproject" -unattended -nop4 -ExecutePythonScript="$pwd\scripts\unreal\import-p3-character-assets.py" -log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Import P4 animations and create presentation containers in Unreal
        shell: pwsh
        env:
          WM_P4_SOURCE_BUNDLE: ${{ github.workspace }}\artifacts\p4\source\WM_P4_AuthoredMotionVFXPresentation.source.json
          WM_P4_ANIMATION_FBX_DIR: ${{ github.workspace }}\artifacts\p4\animation-fbx
          WM_P4_IMPORT_REPORT: ${{ github.workspace }}\artifacts\p4\p4-native-report.json
        run: |
          $editor = Join-Path $env:UNREAL_ENGINE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          & $editor "$pwd\game\WorldMakers.uproject" -unattended -nop4 -ExecutePythonScript="$pwd\scripts\unreal\import-p4-animation-presentation.py" -log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run World Makers automation tests after P4 handoff
        shell: pwsh
        run: |
          $editor = Join-Path $env:UNREAL_ENGINE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          & $editor "$pwd\game\WorldMakers.uproject" -unattended -nop4 -nullrhi -ExecCmds="Automation RunTests WorldMakers.;Quit" -TestExit="Automation Test Queue Empty" -log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-authored-handoff-${{ github.sha }}
          path: artifacts/p4
          if-no-files-found: error
