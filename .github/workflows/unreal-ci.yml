name: Unreal CI

on:
  pull_request:
    paths:
      - 'game/**'
      - 'content/**'
      - 'docs/art-style-guide.md'
      - 'docs/m1-8-visual-proof.md'
      - 'docs/m1-9-runtime-certification.md'
      - 'docs/m2-mission-runtime.md'
      - 'scripts/build-unreal.ps1'
      - 'scripts/test-unreal.ps1'
      - 'scripts/preflight-unreal-runner.ps1'
      - 'scripts/collect-unreal-certification-evidence.ps1'
      - 'scripts/validate-m1-prototype.py'
      - 'scripts/validate-m1-certification.py'
      - 'scripts/validate-m1-building-core.py'
      - 'scripts/validate-m1-tablet-ux.py'
      - 'scripts/validate-m1-visual-proof.py'
      - 'scripts/validate-m1-runtime-cert-infra.py'
      - 'scripts/validate-m2-mission-runtime.py'
      - '.github/workflows/unreal-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'game/**'
      - 'content/**'
      - 'docs/art-style-guide.md'
      - 'docs/m1-8-visual-proof.md'
      - 'docs/m1-9-runtime-certification.md'
      - 'docs/m2-mission-runtime.md'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate uproject JSON
        run: python -m json.tool game/WorldMakers.uproject > /dev/null
      - name: Validate pedagogical content source
        run: python scripts/validate-content.py
      - name: Validate M1 building prototype structure
        run: python scripts/validate-m1-prototype.py
      - name: Validate M1.5 source hardening
        run: python scripts/validate-m1-certification.py
      - name: Validate M1.6 Building Core
        run: python scripts/validate-m1-building-core.py
      - name: Validate M1.7 Tablet Child UX
        run: python scripts/validate-m1-tablet-ux.py
      - name: Validate M1.8 Visual Proof
        run: python scripts/validate-m1-visual-proof.py
      - name: Validate M1.9 Runtime Certification Infrastructure
        run: python scripts/validate-m1-runtime-cert-infra.py
      - name: Validate M2 Mission Runtime
        run: python scripts/validate-m2-mission-runtime.py

  unreal-build-and-test:
    if: ${{ vars.UNREAL_SELF_HOSTED_ENABLED == 'true' }}
    runs-on:
      - self-hosted
      - Windows
      - X64
      - unreal
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Preflight locked Unreal runner
        shell: powershell
        run: ./scripts/preflight-unreal-runner.ps1 -EngineRoot '${{ vars.UNREAL_ENGINE_ROOT }}' -RequireAuthoredMap

      - name: Require authored certification map
        run: python scripts/validate-m1-certification.py --require-authored-map

      - name: Build WorldMakers Editor on locked UE version
        shell: powershell
        run: ./scripts/build-unreal.ps1 -EngineRoot '${{ vars.UNREAL_ENGINE_ROOT }}' -EvidenceDir 'artifacts\certification'

      - name: Run complete World Makers automation suite
        shell: powershell
        run: ./scripts/test-unreal.ps1 -EngineRoot '${{ vars.UNREAL_ENGINE_ROOT }}' -TestFilter 'WorldMakers.' -EvidenceDir 'artifacts\certification'

      - name: Collect certification evidence
        if: always()
        shell: powershell
        run: ./scripts/collect-unreal-certification-evidence.ps1 -EngineRoot '${{ vars.UNREAL_ENGINE_ROOT }}' -EvidenceDir 'artifacts\certification'

      - name: Upload Unreal certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unreal-certification-${{ github.sha }}
          path: artifacts/certification/**
          if-no-files-found: warn
          retention-days: 30

      - name: Assert native certification evidence
        if: always()
        shell: powershell
        run: ./scripts/collect-unreal-certification-evidence.ps1 -EngineRoot '${{ vars.UNREAL_ENGINE_ROOT }}' -EvidenceDir 'artifacts\certification' -RequireNativePass
