name: Unreal CI

on:
  pull_request:
    paths:
      - 'game/**'
      - 'content/**'
      - 'scripts/build-unreal.ps1'
      - 'scripts/test-unreal.ps1'
      - 'scripts/validate-m1-prototype.py'
      - '.github/workflows/unreal-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'game/**'
      - 'content/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate uproject JSON
        run: python -m json.tool game/WorldMakers.uproject > /dev/null
      - name: Validate pedagogical content source
        run: python scripts/validate-content.py
      - name: Validate M1 building prototype structure
        run: python scripts/validate-m1-prototype.py

  unreal-build-and-test:
    if: ${{ vars.UNREAL_SELF_HOSTED_ENABLED == 'true' }}
    runs-on:
      - self-hosted
      - Windows
      - X64
      - unreal
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build WorldMakers Editor
        shell: powershell
        run: ./scripts/build-unreal.ps1 -EngineRoot '${{ vars.UNREAL_ENGINE_ROOT }}'
      - name: Run World Makers automation tests
        shell: powershell
        run: ./scripts/test-unreal.ps1 -EngineRoot '${{ vars.UNREAL_ENGINE_ROOT }}'
