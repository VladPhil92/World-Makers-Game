name: Unreal Source Preflight

on:
  pull_request:
    paths:
      - 'game/**'
      - 'scripts/validate-unreal-source-preflight.py'
      - 'scripts/validate-windows-workstation-contract.py'
      - 'scripts/classify-unreal-build-log.py'
      - 'scripts/test-unreal-build-classifier.py'
      - 'scripts/resolve-unreal-engine.ps1'
      - 'scripts/diagnose-unreal-workstation.ps1'
      - 'scripts/run-unreal-readiness-gate.ps1'
      - 'scripts/open-unreal-project.ps1'
      - 'scripts/build-unreal.ps1'
      - 'scripts/test-unreal.ps1'
      - 'WorldMakers-Doctor.cmd'
      - 'WorldMakers-Readiness.cmd'
      - 'WorldMakers-OpenEditor.cmd'
      - 'WorldMakers-DiagnoseLastFailure.cmd'
      - 'docs/native-unreal-readiness-gate.md'
      - 'README.md'
      - '.gitattributes'
      - '.github/workflows/unreal-source-preflight.yml'
  push:
    branches:
      - main
    paths:
      - 'game/**'
      - 'scripts/validate-unreal-source-preflight.py'
      - 'scripts/validate-windows-workstation-contract.py'
      - 'scripts/classify-unreal-build-log.py'
      - 'scripts/test-unreal-build-classifier.py'
      - 'scripts/resolve-unreal-engine.ps1'
      - 'scripts/diagnose-unreal-workstation.ps1'
      - 'scripts/run-unreal-readiness-gate.ps1'
      - 'scripts/open-unreal-project.ps1'
      - 'scripts/build-unreal.ps1'
      - 'scripts/test-unreal.ps1'
      - 'WorldMakers-Doctor.cmd'
      - 'WorldMakers-Readiness.cmd'
      - 'WorldMakers-OpenEditor.cmd'
      - 'WorldMakers-DiagnoseLastFailure.cmd'
      - 'docs/native-unreal-readiness-gate.md'
      - 'README.md'
      - '.gitattributes'
      - '.github/workflows/unreal-source-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate UE 5.8 source readiness
        run: python scripts/validate-unreal-source-preflight.py
      - name: Validate Windows workstation bootstrap contract
        run: python scripts/validate-windows-workstation-contract.py
      - name: Test native Unreal failure classifier
        run: python scripts/test-unreal-build-classifier.py
